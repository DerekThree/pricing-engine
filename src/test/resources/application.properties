transaction-processor.wake-up-url=\
    ${TRANSACTION_PROCESSOR_WAKE_UP_URL:http://localhost:8081/api/v1/mock/txn/wake}
transaction-processor.max-attempts=${TRANSACTION_PROCESSOR_MAX_ATTEMPTS:3}
transaction-processor.http-timeout=${TRANSACTION_PROCESSOR_HTTP_TIMEOUT:2s}
transaction-processor.retry-delay=${TRANSACTION_PROCESSOR_RETRY_DELAY:1s}
database.max-attempts=${DATABASE_MAX_ATTEMPTS:3}
database.retry-delay=${DATABASE_RETRY_DELAY:1s}
database.recovery-check-interval=${DATABASE_RECOVERY_CHECK_INTERVAL:5s}
springdoc.api-docs.version=OPENAPI_3_0
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
account-store.datasource.url=jdbc:h2:mem:accounts;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
account-store.datasource.username=sa
account-store.datasource.password=
account-store.datasource.driver-class-name=org.h2.Driver
account-store.jpa.ddl-auto=create-drop
recommendation-store.datasource.url=jdbc:h2:mem:recommendations;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
recommendation-store.datasource.username=sa
recommendation-store.datasource.password=
recommendation-store.datasource.driver-class-name=org.h2.Driver
