spring.application.name=pricing-engine
engine.max-workers=${ENGINE_MAX_WORKERS:3}
transaction-processor.wake-up-url=\
    ${TRANSACTION_PROCESSOR_WAKE_UP_URL:http://localhost:8081/api/v1/mock/txn/wake}
transaction-processor.max-attempts=${TRANSACTION_PROCESSOR_MAX_ATTEMPTS:3}
transaction-processor.http-timeout=${TRANSACTION_PROCESSOR_HTTP_TIMEOUT:2s}
transaction-processor.retry-delay=${TRANSACTION_PROCESSOR_RETRY_DELAY:1s}
database.max-attempts=${DATABASE_MAX_ATTEMPTS:3}
database.retry-delay=${DATABASE_RETRY_DELAY:1s}
database.recovery-check-interval=${DATABASE_RECOVERY_CHECK_INTERVAL:5s}
server.port=${SERVER_PORT:8082}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pricingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pricingdb_engine}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pricingpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
database-initialization.enabled=true
database-initialization.datasource.url=${spring.datasource.url}
database-initialization.datasource.username=${INITIALIZATION_USERNAME:pricinguser}
database-initialization.datasource.password=${INITIALIZATION_PASSWORD:pricingpass}
pricing-store.backend.username=${PRICING_STORE_BACKEND_USERNAME:pricingdb_backend}
pricing-store.backend.password=${PRICING_STORE_BACKEND_PASSWORD:pricingpass}
account-store.datasource.url=${ACCOUNT_STORE_URL:jdbc:postgresql://localhost:5432/accountdb}
account-store.datasource.username=${ACCOUNT_STORE_USERNAME:accountdb_engine}
account-store.datasource.password=${ACCOUNT_STORE_PASSWORD:accountpass}
account-store.datasource.driver-class-name=org.postgresql.Driver
account-store.mock-server.username=${ACCOUNT_STORE_MOCK_SERVER_USERNAME:accountdb_mock_server}
account-store.mock-server.password=${ACCOUNT_STORE_MOCK_SERVER_PASSWORD:accountpass}
recommendation-store.datasource.url=\
    ${RECOMMENDATION_STORE_URL:jdbc:postgresql://localhost:5432/recommendationdb}
recommendation-store.datasource.username=${RECOMMENDATION_STORE_USERNAME:recommendationdb_engine}
recommendation-store.datasource.password=${RECOMMENDATION_STORE_PASSWORD:recommendationpass}
recommendation-store.datasource.driver-class-name=org.postgresql.Driver
recommendation-store.txn-processor.username=\
    ${RECOMMENDATION_STORE_TXN_PROCESSOR_USERNAME:recommendationdb_txn_processor}
recommendation-store.txn-processor.password=\
    ${RECOMMENDATION_STORE_TXN_PROCESSOR_PASSWORD:recommendationpass}
