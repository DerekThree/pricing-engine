name: Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          path: pricing-engine

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run engine tests and build
        working-directory: pricing-engine
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build Docker image
        run: docker build -f pricing-engine/Dockerfile -t pricing-engine:ci .
        
      - name: Export verified Docker image
        if: github.event_name == 'push'
        run: docker save pricing-engine:ci -o pricing-engine-image.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-engine-image
          path: pricing-engine-image.tar
          if-no-files-found: error
          retention-days: 1
