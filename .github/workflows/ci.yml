name: Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Expected main commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          path: pricing-engine
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Check out the recorded main commit
        if: github.event_name == 'workflow_dispatch'
        working-directory: pricing-engine
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            ! git merge-base --is-ancestor "$EXPECTED_SHA" "$GITHUB_SHA"; then
            echo "::error::The requested commit must be in main's history."
            exit 1
          fi
          git checkout --detach "$EXPECTED_SHA"

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run engine tests and build
        working-directory: pricing-engine
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build Docker image
        run: docker build -f pricing-engine/Dockerfile -t pricing-engine:ci .
        
      - name: Export verified Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: docker save pricing-engine:ci -o pricing-engine-image.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-engine-image-${{ inputs.commit_sha || github.sha }}
          path: pricing-engine-image.tar
          if-no-files-found: error
          retention-days: 1
